# nginx no hereda `add_header` hacia un `location` que declara los suyos, así
# que este snippet se incluye en cada bloque que añade headers.
#
# Sin CSP de `default-src`/`img-src` a propósito: las imágenes firmadas de
# R2 vienen de otro origen y el service worker de la PWA hace fetch hacia él.
# `frame-ancestors` cubre el clickjacking sin restringir lo demás.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
